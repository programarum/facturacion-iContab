name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # La URL del servicio es opcional; sin ella se activan archivos firmados offline.
      - name: Build Tauri app (Windows)
        env:
          ICONTAB_LICENSE_SERVER_URL: ${{ secrets.ICONTAB_LICENSE_SERVER_URL }}
          ICONTAB_LICENSE_PUBLIC_KEY: ${{ secrets.ICONTAB_LICENSE_PUBLIC_KEY }}
        run: |
          if (-not $env:ICONTAB_LICENSE_PUBLIC_KEY) { throw "Missing ICONTAB_LICENSE_PUBLIC_KEY secret" }
          if (-not $env:ICONTAB_LICENSE_SERVER_URL) { Remove-Item Env:ICONTAB_LICENSE_SERVER_URL -ErrorAction SilentlyContinue }
          pnpm tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
