[package]
name = "app"
version = "0.1.0"
description = "iContab - Sistema de Facturacion"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

# Base de datos embebida
rusqlite = { version = "0.31", features = ["bundled"] }

# Seguridad
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"

# Utilidades de datos
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
